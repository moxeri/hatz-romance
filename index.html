const ENDINGS={"secret":["히든엔딩 · 검보다 먼저","하츠는 검을 내려놓고 네게 손을 내민다.","……오늘만은 네가 먼저다. 내일은 다시 함께 검을 들자.","오래 쌓인 신뢰가 두 사람만의 약속이 되었다."],"true":["진엔딩 · 같은 방향","하츠는 네 손을 조용히 잡는다.","검을 놓지는 않겠다. 하지만 네가 있는 미래도 지키고 싶다.","서로의 신념을 존중하며 함께 탑을 오른다."],"happy":["해피엔딩 · 서툰 고백","하츠는 눈을 피한 채 한 발 가까이 다가온다.","……좋아한다. 익숙한 말은 아니지만, 진심이다.","느리지만 분명한 사랑이 시작된다."],"promise":["희망엔딩 · 다음 시험에서","하츠는 돌아서다 말고 네 이름을 부른다.","……다음에 만나면, 그때는 제대로 말하겠다.","아직 결론 나지 않은 마음이 다음 층으로 이어진다."],"partner":["동료엔딩 · 등을 맡길 사람","하츠는 자신의 검집을 네게 맡긴다.","……네게라면 등을 맡길 수 있겠군.","연애는 아니지만 흔들리지 않는 동료가 되었다."],"reunion":["재회엔딩 · 서로 다른 계단","서로 다른 계단을 오르던 두 사람이 다시 마주친다.","……또 만났군. 이번에는 함께 갈까.","멀어졌던 시간이 두 사람을 조금 더 단단하게 만들었다."],"solo":["독립엔딩 · 각자의 탑","너는 자신의 길을 택한다. 하츠는 고개를 끄덕인다.","……네 선택을 존중한다. 무사해라.","사랑 대신 자신의 목표를 지켜 낸 결말이다."],"normal":["노멀엔딩 · 지나가는 인연","시험이 끝나고 두 사람은 다른 길로 향한다.","……함께해서 나쁘지 않았다.","서로에게 의미 있는 한 시절로 남았다."],"fail":["공략 실패 · 닿지 않은 마음","하츠가 단호하게 검을 칼집에 넣는다.","……네 마음은 알겠다. 하지만 같은 길을 걷기는 어렵다.","서로의 속도를 맞추지 못했다."],"bad":["배드엔딩 · 부러진 신뢰","하츠는 끝내 뒤돌아보지 않는다.","……네가 나를 이해해 줄 거라 생각했다.","쌓인 오해는 마지막 시험에서 무너졌다."],"reconcile":["화해엔딩 · 다시 쥔 손","하츠가 천천히 고개를 끄덕인다.","……이번에는 말보다 행동으로 보여 줘라. 나도 그러겠다.","상처를 인정한 두 사람은 처음부터 다시 시작한다."],"farewell":["이별엔딩 · 마지막 인사","하츠는 네가 떠날 때까지 그 자리에 서 있다.","……잘 가라. 네 길이 틀리지 않기를 바란다.","서로를 미워하지 않은 채 각자의 길로 떠났다."]};

const KEY='hatz-novel-v3', GKEY='hatz-gallery-v3', READKEY='hatz-read-v3', SAVEKEY='hatz-manual-v3';
const $=id=>document.getElementById(id);
const initial=()=>({node:'b0',a:12,t:10,c:10,flags:[],history:[],steps:0,route:null,ending:null,pending:null,memories:[],started:false});
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let state=read(KEY,initial()),gallery=read(GKEY,[]),visited=read(READKEY,[]),skip=false,showGallery=false;
if(!state||(!NODES[state.node]&&!state.ending))state=initial();
const clamp=v=>Math.max(0,Math.min(100,v));
const node=(tag,cls,txt,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;if(parent)parent.appendChild(e);return e};
const persist=()=>{write(KEY,state);write(GKEY,gallery);write(READKEY,visited)};
function selectRoute(){let f=state.flags;if(state.t<20||f.includes('control_follow2'))return 'fracture';if(f.includes('distance')||f.includes('independent'))return 'reunion';if(state.a>=32&&state.t>=32)return 'bond';if(state.t>=28)return 'comrade';return 'solo'}
function decide(){let f=state.flags, has=x=>f.includes(x),r=state.route;
 if(state.t<=12||state.a<=5)return 'bad';
 if(r==='fracture'){if(has('fracture_0_0')&&has('fracture_1_0')&&has('fracture_2_0')&&state.t>=20)return 'reconcile';return has('fracture_2_2')?'farewell':'fail'}
 if(has('possessive')&&state.t<42)return 'fail';
 if(r==='solo')return has('solo_2_0')?'solo':(state.t>=30?'reunion':'normal');
 if(r==='reunion'&&has('reunion_2_0')&&state.a>=32&&state.t>=35)return 'reunion';
 if(r==='bond'&&state.a>=49&&state.t>=52&&state.c>=24&&has('rescue')&&has('understand')&&has('respect')&&has('mature')&&has('bond_1_0'))return 'secret';
 if(r==='bond'&&state.a>=42&&state.t>=42&&has('mature')&&has('bond_2_0'))return 'true';
 if(r==='bond'&&state.a>=37&&state.t>=33&&!has('possessive'))return 'happy';
 if(r==='comrade'&&state.t>=38&&has('comrade_2_0'))return 'partner';
 if(r==='reunion'&&state.a>=37&&state.t>=30)return 'promise';
 if(r==='comrade'&&state.a>=35&&state.t>=32)return 'promise';
 if(state.t<24)return 'fail';return 'normal';}
function choose(i){if(state.pending||state.ending)return;const n=NODES[state.node],o=n?.choices[i];if(!o)return;
 state.a=clamp(state.a+o.a);state.t=clamp(state.t+o.t);state.c=clamp(state.c+o.c);state.flags.push(o.flag);state.history.push({scene:n.title,label:o.label,flag:o.flag});state.steps++;
 state.pending={choice:o.label,next:o.next,delta:[o.a,o.t,o.c]};persist();render();}
function advance(){if(!state.pending)return;let next=state.pending.next;state.pending=null;
 if(next==='ROUTE'){state.route=selectRoute();next=state.route+'0'}
 if(next==='ENDING'){state.ending=decide();if(!gallery.includes(state.ending))gallery.push(state.ending)}else state.node=next;
 persist();render();}
function remember(){let f=state.flags;let messages=[];
 if(state.node==='b6'&&f.includes('rescue'))messages.push('하츠는 네가 잔해를 받치던 순간을 떠올린 듯 손을 잠시 멈춘다.');
 if(state.node==='b7'&&f.includes('bandage'))messages.push('하츠의 손에는 네가 감아 준 붕대가 아직 남아 있다.');
 if(state.node==='b9'&&f.includes('flirt'))messages.push('하츠는 옥상에서 네가 했던 농담을 기억하는지 잠깐 시선을 피한다.');
 if(state.node==='b12'&&f.includes('independent'))messages.push('하츠는 서로 무사히 돌아오자던 약속을 먼저 떠올린다.');
 if(state.node==='b12'&&f.includes('distance'))messages.push('하츠는 네가 다른 팀을 택했을 때처럼 이번에도 네 선택을 기다린다.');
 if(state.node==='b10'&&f.includes('cling'))messages.push('하츠는 네가 자신의 기분 때문에 선택을 바꾼 일을 기억하고 있다.');
 if(state.node==='bond0'&&f.includes('bandage'))messages.push('하츠는 그날 네가 가져온 붕대를 여전히 가지고 있다.');
 if(state.node==='reunion0'&&f.includes('distance'))messages.push('다른 팀을 택한 그날 이후, 두 사람은 처음으로 긴 대화를 나눈다.');
 if(state.node==='fracture0'&&f.includes('control'))messages.push('작전 회의에서 네가 자신의 결정을 막았던 순간이 아직 둘 사이에 남아 있다.');
 return messages;}
function stats(){[['a','a'],['t','t'],['c','c']].forEach(([k,id])=>{$(id+'Num').textContent=state[k];$(id+'Bar').style.width=state[k]+'%'});$('progress').style.width=Math.min(100,state.steps/50*100)+'%';$('status').textContent=state.ending?'이야기의 끝':state.route?'탑을 오르는 길':'탑을 오르는 길';$('footerText').textContent='TOWER OF GOD';}
function render(){stats();const root=$('screen');root.replaceChildren();if(showGallery){renderGallery(root);return}if(!state.started){renderIntro(root);return}if(state.ending){renderEnding(root);return}
 const n=NODES[state.node];if(!n){state=initial();persist();render();return}
 if(!visited.includes(state.node)){visited.push(state.node);persist()}
 node('div','chapter',n.title,root);node('div','scene',n.scene,root);
 remember().forEach(m=>node('div','flashback',m,root));
 const d=node('div','dialogue',undefined,root),p=node('img','portrait',undefined,d);p.src=$('avatar').src;p.alt='';p.onerror=()=>p.style.display='none';const s=node('div','speech',undefined,d);node('div','speaker','하츠',s);node('div','',n.speech,s);
 if(state.pending){const f=node('div','feedback',undefined,root);node('b','',`너: ${state.pending.choice}`,f);node('div','flash',`호감도 ${delta(state.pending.delta[0])} · 신뢰도 ${delta(state.pending.delta[1])} · 용기 ${delta(state.pending.delta[2])}`,f);const b=node('button','action','이어서 보기 →',root);b.style.marginTop='20px';b.onclick=advance;if(skip)setTimeout(()=>{if(state.pending)advance()},80)}
 else{node('div','prompt','어떻게 대답할까?',root);const list=node('div','options',undefined,root);n.choices.forEach((o,i)=>{const b=node('button','choice',undefined,list);b.type='button';node('span','num',String(i+1).padStart(2,'0'),b);node('span','',o.label,b);node('span','','›',b);b.onclick=()=>{b.blur();choose(i)}})}
 window.scrollTo(0,0);}
function delta(v){return (v>0?'+':'')+v}
function renderIntro(root){const intro=node('div','intro',undefined,root);node('h2','','하츠와 함께 오르는 탑',intro);node('p','','탑의 끝은 아직 멀다. 낯선 검사가 너를 바라본다. 그의 검끝이 향하는 곳에서 이야기가 시작된다.',intro);const b=node('button','action','이야기 시작하기',root);b.style.marginTop='18px';b.onclick=()=>{state.started=true;persist();render()};}
function renderEnding(root){const e=ENDINGS[state.ending];node('div','endingTag','ENDING UNLOCKED',root);node('div','endingTitle',e[0],root);node('div','scene endingScene',e[1],root);const d=node('div','dialogue',undefined,root),s=node('div','speech',undefined,d);node('div','speaker','하츠',s);node('div','',e[2],s);node('div','feedback',e[3],root);const b=node('button','action','다른 결말 도전하기',root);b.style.marginTop='20px';b.onclick=()=>{state=initial();persist();render()};const h=node('button','toggle','이번 회차 선택 기록 보기',root);h.style.marginTop='10px';const log=node('div','history',undefined,root);log.hidden=true;state.history.forEach((x,i)=>node('div','',`${i+1}. ${x.scene} — ${x.label}`,log));h.onclick=()=>log.hidden=!log.hidden;renderCollection(root)}
function renderCollection(root){const c=node('div','collection',undefined,root);node('h3','',`엔딩 도감 · ${gallery.length}/${Object.keys(ENDINGS).length}`,c);const b=node('div','badges',undefined,c);Object.entries(ENDINGS).forEach(([id,e])=>node('span','endingBadge '+(gallery.includes(id)?'found':''),gallery.includes(id)?e[0]:'??? · 미발견',b));}
function renderGallery(root){node('div','chapter','엔딩 도감',root);renderCollection(root);node('div','saveinfo','엔딩 기록은 이 브라우저에 저장돼. 사이트 주소나 브라우저를 바꾸면 기록이 이전되지 않을 수 있어.',root);const b=node('button','action secondary','게임으로 돌아가기',root);b.style.marginTop='20px';b.onclick=()=>{showGallery=false;render()}}
$('restart').onclick=()=>{if(!confirm('처음부터 다시 시작할까? 발견한 엔딩은 유지돼.'))return;state=initial();showGallery=false;persist();render()};
$('saveBtn').onclick=()=>{write(SAVEKEY,state);alert('저장했어.')};
$('loadBtn').onclick=()=>{const s=read(SAVEKEY,null);if(!s){alert('저장된 슬롯이 없어.');return}if(!confirm('저장된 진행으로 돌아갈까? 현재 진행은 덮어써져.'))return;state=s;showGallery=false;persist();render()};
$('galleryBtn').onclick=()=>{showGallery=!showGallery;render()};
$('skipBtn').onclick=()=>{skip=!skip;$('skipBtn').textContent='읽은 장면 건너뛰기: '+(skip?'켬':'끔')};
render();
</script></body></html>
