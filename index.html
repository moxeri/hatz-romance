const BRIDGES={"1":["아침에 훈련장으로 가는 길, 어젯밤의 짧은 대화가 문득 떠오른다.","전날 헤어지기 전 하츠가 검집을 다시 고쳐 매던 모습이 생각난다.","복도에서 헤어진 뒤에도 금속이 닿는 소리가 한동안 귀에 남아 있었다."],"2":["하츠의 자세를 따라 하던 중 발끝이 엉킨다.","그의 발놀림을 눈으로 좇다가 한 박자 늦게 움직인다.","대련 속도를 올리자 미처 보지 못한 빈틈이 드러난다."],"3":["훈련을 마친 뒤 둘은 식당으로 향한다.","손바닥의 모래를 털어 내고 늦은 점심을 먹으러 간다.","하츠가 먼저 목검을 정리하고 식당 쪽으로 걸음을 옮긴다."],"4":["식사를 끝내자 다음 시험 공지가 도착한다.","식당을 나오는 길, 모두의 단말기에 같은 지도가 뜬다.","십이수의 목소리가 멀어질 무렵 감독관의 호출이 울린다."],"5":["지도에 표시한 길을 따라 시험장에 들어선다.","선택한 경로를 확인하며 통로 안쪽으로 진입한다.","마지막으로 후방을 확인한 뒤 좁은 통로를 지난다."],"6":["구조가 끝나자 치료를 받을 시간이 주어진다.","집결지에 도착하고서야 하츠의 손에서 피가 난 걸 알아챈다.","먼지가 가라앉은 뒤 하츠가 상처 난 손을 감춘다."],"7":["숙소의 불이 하나둘 꺼진 뒤에도 잠이 오지 않는다.","약품 냄새가 가시지 않은 손을 씻고 옥상으로 향한다.","하츠가 상처를 감싼 손을 확인하던 모습이 계속 떠오른다."],"8":["옥상에서 한동안 바람을 맞던 하츠가 먼저 입을 연다.","계단으로 내려가기 전, 하츠가 뜻밖의 질문을 건넨다.","서로 말이 없어진 순간 하츠가 난간에서 손을 뗀다."],"9":["다음 날 오전, 시험 준비실에 다시 모인다.","밤의 대화가 끝나고 하루가 지난 뒤, 새로운 정찰 제안이 들어온다.","다음 시험에 필요한 정보가 부족하다는 공지가 붙는다."],"10":["정찰에서 모은 지도를 펼치자 위험 지점이 드러난다.","동료들이 가져온 정보를 비교하는 동안 하츠가 작전표를 꺼낸다.","출발 직전 작전 회의에서 예상하지 못한 변수가 발견된다."],"11":["작전 회의 다음 날, 감독관이 팀 편성 규칙을 바꾼다.","시험장 입구에서 팀을 나누라는 지시가 내려온다.","서로의 역할을 정한 직후 새로운 팀 편성 명령이 나온다."],"12":["서로 다른 통로에서 시험을 마치고 집결지로 돌아온다.","합류 지점의 문이 열리고 익숙한 검집이 보인다.","길었던 시험이 끝나자 사람들은 서로의 생사를 확인한다."],"13":["잠시 물을 마신 뒤 다음 층으로 향할 준비를 한다.","집결지의 소음이 줄어들고 두 사람만 뒤에 남는다.","하츠가 다음 층의 문 앞에서 기다리고 있다."]};

const EPILOGUES={"true":[["마지막 시험의 밤","시험장에 남은 불빛이 하나씩 꺼진다. 하츠는 사람들이 떠난 뒤에도 네가 오기를 기다리고 있었다. 손에는 오래전에 네가 묶어 주었던 천 조각이 들려 있다.","하츠","그때 네가 했던 말을 기억한다. 혼자 모든 걸 짊어질 필요는 없다고 했지."],["숨겨 둔 흔적","그는 천을 다시 검집에 묶는다. 훈련장에서 처음 손목을 고쳐 주던 날과 달리, 이번에는 먼저 네 손을 잡는다. 손가락이 조금 떨린다.","하츠","전투에서는 망설이지 않는데… 네 앞에서는 왜 이렇게 어렵지."],["서로의 선택","너는 검을 버리라는 말 대신, 그가 돌아올 자리를 남겨 두겠다고 말한다. 하츠는 한참 너를 바라본다. 그의 표정에서 경계가 천천히 사라진다.","하츠","네가 내 길을 바꾸려 하지 않아서 좋았다. 그러면서도, 내가 돌아갈 곳이 되어 줬어."],["처음 하는 고백","바람이 불어와 네 머리카락을 흩트린다. 하츠는 손을 뻗었다가 멈춘다. 네가 고개를 끄덕이자 조심스럽게 머리카락을 넘겨 준다.","하츠","좋아한다. 동료로서가 아니라… 너라는 사람을."],["새벽의 약속","아침 종이 울리기 전, 두 사람은 다음 층으로 향하는 문 앞에 선다. 그는 검집을 바로잡고는 네 쪽으로 손바닥을 편다.","하츠","위험한 순간에도 네 판단을 믿겠다. 그러니 너도 내게 기대어라."],["같은 방향","너는 그의 손을 잡는다. 계단은 여전히 길고, 다음 시험은 아무도 모른다. 하지만 이번에는 어느 쪽이 먼저 걷는지 중요하지 않다.","하츠","끝까지 함께 가자. 내가 먼저 가더라도 반드시 뒤돌아볼 테니까."],["에필로그 · 돌아올 자리","훗날, 검을 손질하던 하츠가 문득 묻는다. “처음 만난 날, 왜 내게 말을 걸었지?” 네가 대답하기도 전에 그가 희미하게 웃는다. 이미 답을 알고 있는 얼굴이다.","하츠","…아니, 됐다. 그날 네가 와 줘서 다행이다."]],"happy":[["시험이 끝난 오후","승리의 소란이 가라앉자 하츠가 네 앞에 선다. 주변을 살피던 그는 사람이 적은 복도로 너를 이끈다. 평소와 달리 말할 타이밍을 찾지 못한다.","하츠","잠깐… 같이 걸을 수 있겠나."],["서툰 질문","창가에서 멈춘 그는 네 손에 들린 작은 물병을 바라본다. 사소한 질문을 몇 번이나 고르다가 결국 정면으로 눈을 마주친다.","하츠","네가 다른 사람과 웃고 있으면… 자꾸 신경이 쓰인다."],["뜻밖의 질투","네가 장난스럽게 이유를 묻자 하츠는 귀 끝을 붉힌다. 곧 검집을 만지작거리며 시선을 피한다.","하츠","질투라는 말로 부른다면… 부정하지 않겠다."],["한 걸음","그는 잠시 망설이다 손을 내민다. 네가 손가락을 맞잡자 어깨의 힘이 풀린다. 조금 어색하지만, 놓지는 않는다.","하츠","나는 이런 일에 능숙하지 않다. 그래도 네게는 제대로 말하고 싶어."],["말로 하는 약속","너는 다음 시험이 끝난 뒤에도 같이 시간을 보내자고 한다. 하츠는 대답 대신 고개를 끄덕이고, 곧 작은 목소리로 덧붙인다.","하츠","다음 층에 가면… 둘이서 식사하자. 임무가 아니라 약속으로."],["첫 데이트","다음 층의 시장은 시끄럽고 낯설다. 그는 사람들 사이에서 네 손을 놓칠까 봐 손을 더 단단히 잡는다. 네가 웃자 그도 아주 잠깐 웃는다.","하츠","웃지 마라. …아니, 웃어도 된다. 네가 즐거우면 나도 좋으니까."],["에필로그 · 익숙해지는 마음","그날 이후 하츠는 훈련을 마칠 때마다 네가 있는 곳을 먼저 찾는다. 거창한 고백은 드물어도, 너를 위한 자리는 언제나 비워 둔다.","하츠","오늘도 같이 돌아갈까?"]],"normal":[["다음 층으로","문이 열리고 새로운 층의 바람이 밀려온다. 하츠는 앞서 가다가 네 걸음에 맞춰 속도를 늦춘다. 둘 사이에는 아직 이름 붙이지 못한 감정이 남아 있다.","하츠","이번 시험에서는 네 판단이 도움이 됐다."],["늦은 식사","두 사람은 작은 식당에 마주 앉는다. 평소라면 훈련 이야기를 했을 텐데, 오늘은 사소한 취향과 고향에 관한 이야기가 길어진다.","하츠","네가 이런 걸 좋아하는 줄은 몰랐군."],["조용한 인정","하츠는 네가 생각보다 단단한 사람이라는 걸 알게 되었다고 말한다. 그 말은 칭찬이라기보다 오랜 관찰 끝에 내린 결론처럼 들린다.","하츠","네 곁에 있으면 배울 게 많다."],["아직은","잠시 침묵이 흐른다. 너는 묻고 싶은 말이 있지만 서두르지 않기로 한다. 하츠 역시 쉽게 답을 정할 사람이 아니다.","하츠","지금의 우리도 나쁘지 않다고 생각한다."],["새로운 약속","다음 훈련 시간이 정해진다. 그는 네게 검을 건네고 먼저 자세를 잡는다. 이제 그의 말투에는 처음 만났을 때의 차가움이 없다.","하츠","내일도 함께 연습하자."],["계속되는 길","계단 위에서 하츠가 손을 흔든다. 너는 그 옆으로 달려간다. 아직 미래는 알 수 없지만, 오늘의 걸음은 편안하다.","하츠","늦지 마라. …기다리고 있을 테니까."],["에필로그 · 이름 없는 사이","훗날 누군가 둘의 관계를 묻는다. 하츠는 잠시 생각하다가 “믿을 수 있는 사람”이라고 답한다. 너는 그 말이 싫지 않다.","하츠","다음 이야기는… 함께 만들어 가면 되겠지."]],"fail":[["남겨진 질문","시험이 끝난 후 너는 하츠에게 마음을 전한다. 그는 끝까지 듣고, 한참 뒤 조용히 입을 연다.","하츠","네 마음을 가볍게 생각하지 않는다."],["다른 속도","그는 말끝을 고르며 검집의 끈을 조인다. 네가 바라던 대답이 아니라는 걸 두 사람 모두 알고 있다.","하츠","하지만 내가 지금 줄 수 있는 답은… 그 마음과 같지 않다."],["말하지 못한 이유","너는 무엇이 부족했는지 묻지 않는다. 그도 네 잘못을 찾으려 하지 않는다. 마음이 같은 방향으로 움직이지 않을 수도 있다는 사실만 남는다.","하츠","억지로 약속하면, 결국 너를 더 아프게 할 거다."],["마지막 배려","헤어지기 전 그는 네게 남은 식량을 건넨다. 평소와 다르지 않은 배려가 오늘따라 유난히 멀게 느껴진다.","하츠","다음 시험은 길다. 챙겨 가라."],["각자의 밤","그날 밤 너는 쉽게 잠들지 못한다. 하지만 다음 날 훈련장으로 걸어가는 발걸음은 멈추지 않는다. 하츠는 먼 곳에서 네게 짧게 고개를 숙인다.","하츠","…잘 지내라."],["다시 일어서기","너는 검을 들고 혼자 자세를 잡는다. 처음 그에게 배운 발의 위치가 떠오른다. 그가 남긴 것은 상처만이 아니라 네가 쌓아 온 시간이다.","나","이 길도 내가 선택한 거야."],["에필로그 · 다른 계단","몇 층이 지난 뒤, 두 사람은 다른 계단에서 스쳐 지나간다. 하츠는 무사한 너를 보고 아주 작게 미소 짓는다. 사랑은 이루어지지 않았지만, 그날의 진심까지 거짓이 된 것은 아니다.","하츠","네가 앞으로 나아가고 있어 다행이다."]],"bad":[["무너진 작전","시험의 마지막 신호가 울린다. 서로를 믿지 못한 순간, 계획은 어긋났다. 둘 다 살아남았지만 돌아오는 길에 아무도 먼저 말을 꺼내지 않는다.","하츠","…그때 왜 신호를 무시했지."],["날 선 침묵","너는 이유를 설명하려 하지만 하츠는 이미 결정을 내린 얼굴이다. 그의 눈에는 분노보다 깊은 실망이 있다.","하츠","실수는 고칠 수 있다. 하지만 믿음을 버린 선택은 다르다."],["돌아오지 않는 대답","며칠 뒤, 네가 훈련장을 찾았을 때 그는 혼자 검을 닦고 있다. 네 발소리를 알아채고도 고개를 들지 않는다.","나","한 번만 더 이야기하면 안 될까?"],["닫힌 문","하츠는 검을 집어 든다. 한때 네게 내밀던 손은 이제 검집 위에 얹혀 있다.","하츠","지금은 네게 등을 맡길 수 없다."],["마지막 시험","같은 팀으로 배정될 기회가 찾아오지만 그는 다른 조를 택한다. 너는 그 선택을 붙잡지 못한다. 시험장의 문이 두 사람 사이에서 닫힌다.","하츠","무사히 올라가라."],["혼자의 길","너는 혼자 계단을 오른다. 몇 번이나 뒤돌아보지만 익숙한 발소리는 들리지 않는다. 잘못된 선택은 되돌릴 수 없지만, 다음 선택까지 포기할 필요는 없다.","나","다음에는… 다르게 행동할 거야."],["에필로그 · 닿지 않은 검","먼 훗날 누군가 검을 든 검사의 소문을 전한다. 너는 그 이름을 듣고 잠시 멈춘다. 같은 탑을 오르면서도 다시 만나지 못한 사람이 있다는 사실이 오래 마음에 남는다.","나","하츠… 잘 지내고 있겠지."]]};
const ENDINGS={"true":["진엔딩 · 같은 방향","마지막 시험이 끝난 뒤, 하츠는 검집을 내려놓고 네 앞에 선다. 오래 망설인 듯한 표정이다.","……너와 함께 가고 싶다. 검을 쥔 채로도 지킬 수 있는 것이 있다는 걸 알게 됐다.","두 사람은 각자의 신념을 잃지 않은 채 같은 길을 선택한다."],"happy":["해피엔딩 · 서툰 약속","시험을 마친 하츠가 너를 찾아온다. 평소보다 조금 늦게 말을 꺼낸다.","……다음 층에서도 함께 있어 줬으면 한다. 네가 괜찮다면.","말보다 행동이 앞서는 두 사람의 연애가 조심스럽게 시작된다."],"normal":["노멀엔딩 · 나란한 걸음","다음 층으로 가는 문이 열린다. 하츠는 네게 손짓한다.","서두를 필요는 없겠지. 앞으로도 서로 배울 일이 많을 테니까.","아직 이름 붙이지 않은 관계지만 서로의 존재가 익숙해졌다."],"fail":["공략 실패 · 다른 속도","마지막 시험을 앞두고 두 사람은 긴 대화를 나눈다. 하츠는 조용히 고개를 젓는다.","네 마음을 가볍게 여기지는 않는다. 하지만 지금은 같은 마음으로 답할 수 없어.","마음은 전해졌지만 관계는 연애로 이어지지 못했다."],"bad":["배드엔딩 · 닫힌 문","작전이 끝난 뒤, 하츠는 끝내 너를 돌아보지 않는다.","……이번에는 네게 등을 맡길 수 없겠군.","쌓인 오해를 풀지 못한 채 두 사람은 서로 다른 길로 향한다."]};

const KEY='hatz-novel-v4', GKEY='hatz-gallery-v4', READKEY='hatz-read-v4', SAVEKEY='hatz-manual-v4';
const $=id=>document.getElementById(id);
const initial=()=>({node:'b0',a:12,t:10,c:10,flags:[],history:[],steps:0,route:null,ending:null,epilogueIndex:0,pending:null,memories:[],started:false});
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))||f}catch(e){return f}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let epilogueTimer=null;
let state=read(KEY,initial()),gallery=read(GKEY,[]),visited=read(READKEY,[]),skip=false,showGallery=false;
if(!state||(!NODES[state.node]&&!state.ending))state=initial();
const clamp=v=>Math.max(0,Math.min(100,v));
const node=(tag,cls,txt,parent)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;if(parent)parent.appendChild(e);return e};
const persist=()=>{write(KEY,state);write(GKEY,gallery);write(READKEY,visited)};
function selectRoute(){const f=state.flags;
 if(state.t<17||f.includes('control_follow2'))return 'fracture';
 if(f.includes('distance')||f.includes('independent'))return 'reunion';
 if(state.a>=29&&state.t>=29)return 'bond';
 if(state.t>=25)return 'comrade';return 'solo';}
function decide(){const f=state.flags,has=x=>f.includes(x),r=state.route;
 // Trust and affection are separate; critical decisions matter more than totals.
 if(state.t<=12|| (r==='fracture'&&state.t<24))return 'bad';
 if(has('possessive')&&state.t<37)return 'fail';
 if(r==='fracture')return state.t>=34&&state.a>=34?'normal':'fail';
 if(r==='bond'&&state.a>=39&&state.t>=39&&has('mature')&&has('respect'))return 'true';
 if(state.a>=37&&state.t>=25&&r!=='solo'&&!has('possessive'))return 'happy';
 if(state.a>=28&&state.t>=26)return 'normal';
 if(state.t>=33&&state.a<28)return 'normal';
 if(state.a>=30&&state.t<25)return 'fail';
 return 'normal';}
function choose(i){if(state.pending||state.ending)return;const n=NODES[state.node],o=n?.choices[i];if(!o)return;
 state.a=clamp(state.a+o.a);state.t=clamp(state.t+o.t);state.c=clamp(state.c+o.c);state.flags.push(o.flag);state.history.push({scene:n.title,label:o.label,flag:o.flag,from:state.node,choiceIndex:i});state.steps++;
 let destination=o.next; if(['b4','b10'].includes(state.node)&&NODES[destination]){const follow=NODES[destination];state.flags.push('brief_'+destination);destination=follow.choices[0].next;} state.pending={choice:o.label,next:destination,delta:[o.a,o.t,o.c]};persist();render();}
function advance(){if(!state.pending)return;let next=state.pending.next;state.pending=null;
 if(next==='ROUTE'){state.route=selectRoute();next=state.route+'0'}
 if(next==='ENDING'){state.ending=decide();state.epilogueIndex=0;if(!gallery.includes(state.ending))gallery.push(state.ending)}else state.node=next;

 persist();render();}
function remember(){const f=state.flags,m=[];
 const add=(at,flag,line)=>{if(state.node===at&&f.includes(flag))m.push(line)};
 add('b6','rescue','통로에서 잔해를 받치던 순간, 하츠가 너를 향해 고개를 돌렸던 표정이 떠오른다.');
 if(state.node==='b6'&&state.a>=22)m.push('무너지는 통로를 지나며 하츠가 네 손목을 붙잡는다. 위험이 사라진 뒤에도 손을 놓지 않던 그는 네 시선을 느끼고서야 조용히 손을 뗀다. “……다친 줄 알았다.”');
 if(state.node==='b9'&&state.a>=27)m.push('사람들 사이에서 누군가 네게 다가와 말을 걸자 하츠가 무심한 듯 네 옆에 선다. “다음 훈련은 나와 하기로 하지 않았나.” 뒤늦게 약속이 없었다는 걸 떠올린 그가 잠깐 시선을 피한다.');
 if(state.node==='b12'&&state.t>=29)m.push('작전을 정리하던 하츠가 다른 동료들 앞에서 네 이름을 먼저 부른다. “이쪽 판단은 네게 맡기겠다.” 늘 혼자 결정을 내리던 그가 너를 선택한 순간, 주변이 잠시 조용해진다.');
 add('b7','bandage','옥상 난간을 짚은 하츠의 손에 네가 가져다준 붕대가 감겨 있다.');
 add('b7','care','하츠가 한 번 너를 돌아본다. 복도에서 혼자 있던 그를 찾아갔던 첫날과 같은 시선이다.');
 add('b9','tease','하츠는 네가 다가오자 처음 만난 날의 농담이 생각난 듯 잠깐 눈썹을 치켜올린다.');
 add('b10','observe','하츠가 지도 한쪽을 네게 내민다. 훈련장에서 먼저 관찰하던 네 태도를 기억하는 듯하다.');
 add('b12','distance','서로 다른 팀을 고른 순간의 침묵이 다시 떠오른다.');
 add('b12','independent','혼자 판단하겠다고 했던 네 말이 이번 시험에서 어떤 의미였는지 생각하게 된다.');
 add('bond0','bandage','하츠는 그때의 붕대를 말끔하게 접어 가지고 있다.');
 add('reunion0','distance','헤어지던 날 나눴던 마지막 말이 계단 위의 침묵 속에서 되살아난다.');
 add('fracture0','control','작전 회의에서 하츠의 판단을 막았던 일이 아직 정리되지 않았다.');
 return m;}
function stats(){$('progress').style.width=Math.min(100,state.steps/50*100)+'%';$('status').textContent=state.ending?'이야기의 끝':state.route?'탑을 오르는 길':'탑을 오르는 길';$('footerText').textContent='TOWER OF GOD';}
function sceneArt(root,key){
 const art={b3:['casual','잠시, 검을 내려놓은 시간'],b7:['close','말없이 마주친 시선'],b9:['casual','뜻밖의 마주침'],b12:['close','쉽게 꺼내지 못한 말'],bond1:['close','가까워진 거리']};
 const data=art[key];if(!data)return;
 const figure=node('figure','storyArt',undefined,root);figure.style.marginTop='14px';
 const img=node('img','',undefined,figure);img.src=HATZ_SCENE_IMAGES[data[0]];img.alt='하츠의 모습';img.loading='lazy';
 node('figcaption','',data[1],figure);
}
function endingArt(root,ending,idx){
 const kind=(ending==='true'||ending==='happy')?'close':(ending==='normal'?'casual':null);
 if(!kind||idx!==3)return;
 const figure=node('figure','storyArt',undefined,root);const img=node('img','',undefined,figure);img.src=HATZ_SCENE_IMAGES[kind];img.alt='하츠의 모습';img.loading='lazy';
}
function render(){stats();const root=$('screen');root.replaceChildren();if(showGallery){renderGallery(root);return}if(!state.started){renderIntro(root);return}if(state.ending){renderEnding(root);return}
 const n=NODES[state.node];if(!n){state=initial();persist();render();return}
 if(!visited.includes(state.node)){visited.push(state.node);persist()}
 node('div','chapter',n.title,root);
 const last=state.history[state.history.length-1];
 if(/^b\d+$/.test(state.node)&&last&&last.from&&last.from.startsWith('f')){
   const number=Number(state.node.slice(1));const lines=BRIDGES[number];
   if(lines){const variant=last.choiceIndex===undefined?0:last.choiceIndex;node('div','flashback',lines[variant%lines.length],root)}
 }
 node('div','scene',n.scene,root);
 sceneArt(root,state.node);
 remember().forEach(m=>node('div','flashback',m,root));
 const d=node('div','dialogue',undefined,root),p=node('img','portrait',undefined,d);p.src=HATZ_DIALOGUE_IMAGE;p.alt='';p.onerror=()=>p.style.display='none';const s=node('div','speech',undefined,d);node('div','speaker','하츠',s);node('div','',n.speech,s);
 if(state.pending){const f=node('div','feedback',undefined,root);node('b','',`너: ${state.pending.choice}`,f);if(NODES[state.pending.next]&&state.node.startsWith('b'))node('div','flash',NODES[state.pending.next].scene,f);const b=node('button','action','계속',root);b.style.marginTop='20px';b.onclick=advance;if(skip)setTimeout(()=>{if(state.pending)advance()},80)}
 else{node('div','prompt','어떻게 대답할까?',root);const list=node('div','options',undefined,root);n.choices.forEach((o,i)=>{const b=node('button','choice',undefined,list);b.type='button';node('span','num',String(i+1).padStart(2,'0'),b);node('span','',o.label,b);node('span','','›',b);b.onclick=()=>{b.blur();choose(i)}})}
 window.scrollTo(0,0);}
function delta(v){return (v>0?'+':'')+v}
function renderIntro(root){const intro=node('div','intro',undefined,root);node('h2','','하츠와 함께 오르는 탑',intro);node('p','','탑의 끝은 아직 멀다. 낯선 검사가 너를 바라본다. 그의 검끝이 향하는 곳에서 이야기가 시작된다.',intro);const b=node('button','action','이야기 시작하기',root);b.style.marginTop='18px';b.onclick=()=>{state.started=true;persist();render()};}
function renderEnding(root){
 const e=ENDINGS[state.ending],beats=EPILOGUES[state.ending]||[];
 const idx=Math.max(0,Math.min(beats.length,Number(state.epilogueIndex)||0));
 const navigate=(next)=>{state.epilogueIndex=Math.max(0,Math.min(beats.length,next));persist();render()};
 if(idx<beats.length){
  const beat=beats[idx];node('div','chapter',beat[0],root);
  node('div','scene endingScene',beat[1],root);
  endingArt(root,state.ending,idx);
  const d=node('div','dialogue',undefined,root),p=node('img','portrait',undefined,d);p.src=HATZ_DIALOGUE_IMAGE;p.alt='';p.onerror=()=>p.style.display='none';
  const sp=node('div','speech',undefined,d);node('div','speaker',beat[2],sp);node('div','',beat[3],sp);
  node('div','epilogueProgress',Array.from({length:beats.length},(_,i)=>i===idx?'●':'○').join('  '),root);
  const controls=node('div','actions',undefined,root);
  const back=node('button','action secondary','‹ 이전 장면',controls);back.disabled=idx===0;back.style.opacity=idx===0?'0.45':'1';back.onclick=()=>navigate(idx-1);
  const next=node('button','action',idx===beats.length-1?'결말 보기 ›':'다음 장면 ›',controls);next.onclick=()=>navigate(idx+1);
 }else{
  node('div','endingTag','THE END',root);node('div','endingTitle',e[0],root);
  node('div','scene endingScene',e[3],root);
  const controls=node('div','actions',undefined,root);
  const back=node('button','action secondary','‹ 이전 장면',controls);back.onclick=()=>navigate(beats.length-1);
  const again=node('button','action','다시 시작하기',controls);again.onclick=()=>{state=initial();persist();render()};
  const h=node('button','toggle','이번 회차 돌아보기',root);h.style.marginTop='10px';
  const log=node('div','history',undefined,root);log.hidden=true;state.history.forEach((x,i)=>node('div','',`${i+1}. ${x.scene} — ${x.label}`,log));h.onclick=()=>log.hidden=!log.hidden;
  renderCollection(root);
 }
 window.scrollTo(0,0);
}
function renderCollection(root){const c=node('div','collection',undefined,root);node('h3','','엔딩 도감',c);const b=node('div','badges',undefined,c);Object.entries(ENDINGS).forEach(([id,e])=>node('span','endingBadge '+(gallery.includes(id)?'found':''),gallery.includes(id)?e[0]:'??? · 미발견',b));}
function renderGallery(root){node('div','chapter','엔딩 도감',root);renderCollection(root);node('div','saveinfo','엔딩 기록은 이 브라우저에 저장돼. 사이트 주소나 브라우저를 바꾸면 기록이 이전되지 않을 수 있어.',root);const b=node('button','action secondary','게임으로 돌아가기',root);b.style.marginTop='20px';b.onclick=()=>{showGallery=false;render()}}
$('restart').onclick=()=>{if(!confirm('처음부터 다시 시작할까? 발견한 엔딩은 유지돼.'))return;state=initial();showGallery=false;persist();render()};
$('saveBtn').onclick=()=>{write(SAVEKEY,state);alert('저장했어.')};
$('loadBtn').onclick=()=>{const s=read(SAVEKEY,null);if(!s){alert('저장된 슬롯이 없어.');return}if(!confirm('저장된 진행으로 돌아갈까? 현재 진행은 덮어써져.'))return;state=s;showGallery=false;persist();render()};
$('galleryBtn').onclick=()=>{showGallery=!showGallery;epiloguePaused=showGallery;render()};
$('skipBtn').onclick=()=>{skip=!skip;$('skipBtn').textContent='읽은 장면 건너뛰기: '+(skip?'켬':'끔')};
render();
</script></body></html>
